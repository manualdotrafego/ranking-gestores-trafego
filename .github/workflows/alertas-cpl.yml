name: Alertas CPL diário

on:
  schedule:
    - cron: '35 12 * * 1-5'   # 09:35 BRT — execução principal
    - cron: '30 14 * * 1-5'   # 11:30 BRT — reforço (heartbeat): só roda se o principal não rodou hoje
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Teste seco: valida fetch/detecção/publicação SEM enviar Telegram/Discord'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: alertas-cpl
  cancel-in-progress: false

jobs:
  alertas:
    runs-on: ubuntu-latest
    env:
      PROJECT_DIR: ${{ github.workspace }}
      SKIP_GIT: '1'
      DRY_RUN: ${{ inputs.dry_run == true && '1' || '0' }}
      FETCH_LITE: '1'   # nuvem: pula previews/idade (rápido); previews salvos são preservados
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verifica se já rodou hoje (de-dup do heartbeat)
        id: guard
        run: |
          TODAY=$(date -u +%F)
          GEN=$(python3 -c "import json;print(json.load(open('alertas.json')).get('generated_at',''))" 2>/dev/null || echo "")
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$GEN" = "$TODAY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "alertas.json já é de hoje ($GEN) — execução já feita, pulando."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Vai rodar (gen=$GEN | hoje=$TODAY | evento=${{ github.event_name }} | schedule=${{ github.event.schedule }})"
          fi

      - name: Aviso de heartbeat (o principal das 09:35 não rodou)
        if: steps.guard.outputs.skip != 'true' && github.event.schedule == '30 14 * * 1-5'
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ O alerta automático das 09:35 não rodou hoje — disparando agora pelo reforço (heartbeat das 11:30)." >/dev/null || true

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: '3.12'

      - name: Instala dependências
        if: steps.guard.outputs.skip != 'true'
        run: pip install requests python-dotenv

      - name: Atualiza dados do dashboard (fetch Meta)
        if: steps.guard.outputs.skip != 'true'
        run: python "fetch_dashboard_data.py"

      - name: Detecta altas + envia Telegram e Discord
        if: steps.guard.outputs.skip != 'true'
        run: python "cron_alertas_cpl.py"

      - name: Publica dados + alertas no GitHub Pages
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard_data.json alertas.json
          if git diff --cached --quiet; then
            echo "Sem mudanças para publicar"
          else
            git commit -m "alertas CPL $(date +%F) [CI]"
            git pull --rebase --autostash origin main || true
            git push
          fi
