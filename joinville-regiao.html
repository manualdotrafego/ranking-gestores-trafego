<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecionando...</title>
    <meta http-equiv="refresh" content="2;url=https://wa.link/95bepx">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #2D3277 0%, #161a44 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 20px; color: #fff;
        }
        .container {
            background: #ffffff; color: #333; border-radius: 20px; padding: 48px 32px;
            max-width: 480px; width: 100%; text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2); animation: fadeIn 0.6s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .badge {
            width: 80px; height: 80px; margin: 0 auto 24px; background: #3483FA; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(52, 131, 250, 0.6); }
            50% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(52, 131, 250, 0); }
        }
        .badge svg { width: 42px; height: 42px; fill: none; stroke: #fff; stroke-width: 2.2; }
        h1 { font-size: 24px; font-weight: 600; margin-bottom: 16px; color: #2D3277; }
        .region { display:inline-block; margin-bottom:18px; font-size:13px; font-weight:700; letter-spacing:.5px;
            color:#2D3277; background:#3483FA22; padding:6px 14px; border-radius:20px; }
        p { font-size: 16px; color: #555; margin-bottom: 28px; line-height: 1.5; }
        .spinner {
            width: 40px; height: 40px; border: 4px solid #e0e0e0; border-top-color: #3483FA;
            border-radius: 50%; margin: 0 auto 20px; animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .fallback { margin-top: 24px; font-size: 14px; color: #888; }
        .fallback a { color: #3483FA; font-weight: 600; text-decoration: none; }
        .fallback a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <div class="badge">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
        <div class="spinner"></div>
        <span class="region">📍 Joinville e Região</span>
        <h1>Estamos te conectando ao atendimento</h1>
        <p>Aguarde um instante enquanto preparamos o seu atendimento...</p>
        <div class="fallback">
            Se não for redirecionado automaticamente,
            <a href="https://wa.link/95bepx">clique aqui para continuar</a>.
        </div>
    </div>

    <script>
        setTimeout(function() {
            window.location.href = "https://wa.link/95bepx";
        }, 1500);
    </script>
</body>
</html>
