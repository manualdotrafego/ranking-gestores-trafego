<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Programa Polos · Joinville e Região — ECF Consultoria</title>
<meta name="description" content="Programa Polos da ECF: consultoria para fabricantes e lojistas de móveis de Joinville e região venderem mais no Mercado Livre.">
<style>
:root{--escuro:#2D3277;--amarelo:#FFE600;}
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:linear-gradient(135deg,#2D3277 0%,#161a44 100%);color:#fff;text-align:center;}
.box{max-width:560px;}
.brand{font-size:12px;letter-spacing:3px;font-weight:700;opacity:.85;margin-bottom:8px;}
.brand b{color:var(--amarelo);}
.region{display:inline-block;margin:14px 0 18px;font-size:13px;font-weight:700;color:#fff;
  background:#ffffff22;border:1px solid #ffffff33;padding:7px 16px;border-radius:30px;}
h1{font-size:32px;line-height:1.2;font-weight:800;margin-bottom:14px;}
h1 em{color:var(--amarelo);font-style:normal;}
p{font-size:17px;opacity:.92;margin-bottom:30px;}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--amarelo);color:#1b1f3b;
  font-weight:800;font-size:18px;padding:17px 34px;border-radius:14px;
  box-shadow:0 10px 30px rgba(255,230,0,.25);transition:transform .15s;}
.btn:hover{transform:translateY(-2px);}
.btn svg{width:22px;height:22px;}
.note{font-size:13px;opacity:.7;margin-top:14px;}
a{text-decoration:none;}
</style>
</head>
<body>
  <div class="box">
    <div class="brand">ECF <b>|</b> CONSULTORIA &amp; ASSESSORIA</div>
    <span class="region">📍 Joinville e Região — SC</span>
    <h1>Venda mais móveis no <em>Mercado Livre</em> com o Programa Polos</h1>
    <p>Consultoria especializada para fabricantes e lojistas de móveis da sua região estruturarem e escalarem as vendas online.</p>
    <a class="btn" href="https://wa.link/95bepx">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1b1f3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.5 8.5 0 0 1-3.8-.9L3 20l1.4-4.2A8.5 8.5 0 1 1 21 11.5z"/></svg>
      Falar com um especialista
    </a>
    <div class="note">Atendimento direto pela equipe ECF</div>
  </div>
</body>
</html>
