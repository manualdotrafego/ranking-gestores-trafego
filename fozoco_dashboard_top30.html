footer{margin-top:30px;color:var(--grey);font-size:12px;text-align:center}

const brl=n=>'R$ '+n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const num=n=>n.toLocaleString('pt-BR');

 ['Criativos',K.n,''],['Vendas',num(K.vendas),''],['Faturamento',brl(K.fat),''],
 ['Investimento',brl(K.gasto),''],['ROAS médio',K.roas.toFixed(2)+'x','accent'],['CPV médio',brl(K.cpv),'accent']
].map(([l,v,c])=>`<div class="kpi ${c}"><div class="lab">${l}</div><div class="val">${v}</div></div>`).join('');

const SORTS=[['vendas','Vendas'],['fat','Faturamento'],['roas','ROAS'],['cpv','CPV ↑'],['cpc','CPC saída ↑'],['conv','% Conversão'],['gasto','Gasto']];
let sortKey='vendas';
document.getElementById('sorts').innerHTML=SORTS.map(([k,l])=>`<button data-k="${k}" class="${k=='vendas'?'on':''}" onclick="sortBy('${k}')">${l}</button>`).join('');
function sortBy(k){sortKey=k;document.querySelectorAll('#sorts button').forEach(b=>b.classList.toggle('on',b.dataset.k==k));render();}
const ASC=['cpv','cpc'];
function sorted(){return [...D].sort((a,b)=> ASC.includes(sortKey)?a[sortKey]-b[sortKey]:b[sortKey]-a[sortKey]);}

function card(d,i){
 const medal=i<3;
 return `<div class="card">
 <div class="thumb">${d.img?`<img src="${d.img}" alt="">`:''}<div class="${medal?'medal':'rk'}">${medal?['🥇','🥈','🥉'][i]:'#'+(i+1)}</div></div>
 <div class="cbody">
 <div class="cname" title="${d.nome.replace(/"/g,'&quot;')}">${d.nome}</div>
 <div class="ccamp">${d.campanha||'—'}</div>
 <div class="mrow">
  <div class="m vendas"><div class="l">Vendas</div><div class="v">${num(d.vendas)}</div></div>
  <div class="m roas"><div class="l">ROAS</div><div class="v">${d.roas.toFixed(2)}x</div></div>
  <div class="m"><div class="l">Faturamento</div><div class="v">${brl(d.fat)}</div></div>
  <div class="m"><div class="l">CPV</div><div class="v">${brl(d.cpv)}</div></div>
 </div>
 <div class="mini"><span>CPC saída <b>${brl(d.cpc)}</b></span><span>Conv. <b>${d.conv.toFixed(2)}%</b></span><span>Gasto <b>${brl(d.gasto)}</b></span></div>
 <div class="btns">
  <a class="prev ${d.preview?'':'off'}" href="${d.preview||'#'}" target="_blank">Prévia ▶</a>
  <a class="post ${d.post?'':'off'}" href="${d.post||'#'}" target="_blank">Ver post</a>
 </div>
 </div></div>`;
}
const COLS=[['','img'],['#','rank'],['Criativo','nome'],['Vendas','vendas'],['Faturamento','fat'],['ROAS','roas'],['CPV','cpv'],['CPC saída','cpc'],['% Conv','conv'],['Gasto','gasto'],['Links','']];
function render(){
 const s=sorted();
 document.getElementById('grid').innerHTML=s.map((d,i)=>card(d,i)).join('');
 document.getElementById('thead').innerHTML='<tr>'+COLS.map(([l,k])=>`<th ${k?`onclick="sortBy('${k}')"`:''}>${l}</th>`).join('')+'</tr>';
 document.getElementById('tbody').innerHTML=s.map((d,i)=>`<tr>
  <td>${d.img?`<img class="tt" src="${d.img}">`:''}</td>
  <td><b>${i+1}</b></td>
  <td><b>${d.nome}</b><br><span style="color:var(--grey);font-size:11px">${d.campanha||''}</span></td>
  <td class="tnum">${num(d.vendas)}</td>
  <td class="tnum">${brl(d.fat)}</td>
  <td class="tnum troas">${d.roas.toFixed(2)}x</td>
  <td class="tnum">${brl(d.cpv)}</td>
  <td class="tnum">${brl(d.cpc)}</td>
  <td class="tnum">${d.conv.toFixed(2)}%</td>
  <td class="tnum">${brl(d.gasto)}</td>
  <td>${d.preview?`<a class="tlink" href="${d.preview}" target="_blank">Prévia</a>`:''}${d.post?`<a class="tlink" href="${d.post}" target="_blank" style="color:var(--orange)">Post</a>`:''}</td>
 </tr>`).join('');
}
function setView(v){
 document.getElementById('grid').style.display=v=='grid'?'grid':'none';
 document.getElementById('tbl').style.display=v=='tbl'?'block':'none';
 document.getElementById('vGrid').classList.toggle('on',v=='grid');
 document.getElementById('vTbl').classList.toggle('on',v=='tbl');
}
