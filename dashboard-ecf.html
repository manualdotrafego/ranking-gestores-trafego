<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Campanhas ECF Consultoria</title><meta name="description" content="Investimento, funil e criativos das campanhas da ECF Consultoria na Meta."><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#050507"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Manrope:wght@800&display=swap"><style>/* Hallmark · shape: app screen · genre: modern-minimal · theme: custom
 * paper: oklch(12% 0.005 285) · accent: oklch(91% 0.19 104) · display: Manrope · body: Inter
 * nav: a top bar with the filters · signature: the creative cards with cover and video retention · states: loading, empty, error, full
 * axes: dark/sans/yellow · posture: workbench · contrast: pass · v2.0.0 */
/* Hallmark · pre-emit critique: P3 H4 E4 S4 R3 V4 · weakest: P, the layout was requested as a copy of an existing dashboard, so the argument lives in the two separate cost readings */
/* Hallmark · dismissed F4 · .ps button.on is the selected state of a filter and .selchip button is a quiet close control, neither is a primary action */

:root{
  --color-paper:#050507;--color-panel:#0f1116;--color-panel-2:#181b22;--color-panel-3:#232731;
  --color-rule:#262a33;--color-field:#6f7480;
  --color-ink:#eceef2;--color-ink-2:#c4c8d0;--color-muted:#a2a7b1;--color-accent-ink:#0a0a0a;
  --color-accent:#ffe600;--color-accent-soft:#2b2806;--color-accent-rule:#7a6f0a;
  --color-good:#19e06a;--color-good-ink:#06140c;--color-bad:#ff5a4e;--color-bad-ink:#1a0503;
  --color-warn:#ff9a1f;--color-warn-soft:#1f1608;--color-warn-rule:#5c3d12;--color-warn-ink:#ffd9a8;
  --color-violet:#8f7cff;--color-veil:#050507;--color-veil-clear:#05050700;--color-tag:#101218;
  --f1:#5c20c4;--f2:#7b2bff;--f3:#a32cc4;--f4:#bf2a18;--f5:#ff6a00;--f6:#ff9100;--f7:#ffb800;--f8:#19e06a;--f9:#ffe600;
  --font-display:Manrope,Inter,system-ui,sans-serif;--font-body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --text-xs:.75rem;--text-sm:.875rem;--text-md:1rem;--text-lg:1.25rem;--text-xl:1.75rem;--text-2xl:2.25rem;
  --radius-card:12px;--radius-control:8px;--radius-pill:999px;
  --dur-micro:120ms;--dur-short:220ms;
}
*{margin:0;padding:0;box-sizing:border-box}
::selection{background:var(--color-accent);color:var(--color-accent-ink)}
html{scrollbar-color:var(--color-field) var(--color-paper);caret-color:var(--color-accent)}
html,body{overflow-x:clip}
body{background:var(--color-paper);color:var(--color-ink);font:400 var(--text-sm)/1.5 var(--font-body);padding:24px 20px 48px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1320px;margin:0 auto;min-width:0}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
header>div{min-width:0}
.marca{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.marca img{height:26px;width:auto}
.estrela{width:16px;height:16px;fill:var(--color-accent)}
h1{font:800 var(--text-xl)/1.1 var(--font-display);letter-spacing:-.02em;text-wrap:balance;overflow-wrap:break-word;min-width:0}
header .sb{color:var(--color-muted);margin-top:4px}
.lv{color:var(--color-muted);font-size:var(--text-xs)}
.fb,.bc,.kc,.pn,.tw,.cc{background:var(--color-panel);border:1px solid var(--color-rule);border-radius:var(--radius-card)}
.fb{padding:16px;margin-bottom:24px}
.fg{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end}
.fi{display:flex;flex-direction:column;gap:4px;min-width:0;max-width:100%}
.fi>label{font-size:var(--text-xs);color:var(--color-muted)}
.ps{display:flex;gap:4px;flex-wrap:wrap}
button,select,input{font:inherit;color:var(--color-ink)}
.ps button{background:var(--color-panel-2);border:1px solid var(--color-field);border-radius:var(--radius-control);min-height:40px;padding:0 12px;font-size:var(--text-sm);cursor:pointer;transition:background-color var(--dur-micro),border-color var(--dur-micro),color var(--dur-micro)}
.ps button:hover,select:hover,.dt input:hover{border-color:var(--color-accent)}
.ps button:active,.selchip button:active,.ac a:active{transform:translateY(1px)}
.ps button:disabled,select:disabled,input:disabled{opacity:.5;cursor:not-allowed}
.ps button.on{background:var(--color-accent);border-color:var(--color-accent);color:var(--color-accent-ink);font-weight:600}
.dt{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dt input,select{background:var(--color-panel-2);border:1px solid var(--color-field);border-radius:var(--radius-control);min-height:40px;padding:0 12px;font-size:var(--text-sm);color-scheme:dark;max-width:100%}
select{max-width:320px}
.dt span{color:var(--color-muted);font-size:var(--text-xs)}
.rs{margin-top:12px;padding-top:12px;border-top:1px solid var(--color-rule);color:var(--color-ink-2);display:flex;gap:4px 16px;flex-wrap:wrap;align-items:center;font-size:var(--text-xs)}
.rs b{color:var(--color-ink);font-weight:600}
.warn{color:var(--color-warn)}
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:16px;margin-bottom:16px}
.bc{padding:20px 24px}
.bc .l{color:var(--color-muted)}
.bc .v{font:800 var(--text-2xl)/1 var(--font-display);letter-spacing:-.03em;margin-top:8px;color:var(--ac,var(--color-ink));font-variant-numeric:tabular-nums}
.bc .s{font-size:var(--text-xs);color:var(--color-ink-2);margin-top:8px}
.bc.sk{min-height:112px;background:var(--color-panel-2)}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,124px),1fr));gap:8px;margin-bottom:32px}
.kc{padding:12px 16px}
.kc .l{font-size:var(--text-xs);color:var(--color-muted)}
.kc .v{font:800 var(--text-lg)/1.3 var(--font-display);font-variant-numeric:tabular-nums}
h2{font:600 var(--text-md)/1.3 var(--font-body);color:var(--color-ink);margin:0 0 12px;text-wrap:balance}
.pn{padding:24px;margin-bottom:32px}
.fs{display:flex;flex-direction:column;gap:4px;align-items:center}
.fu{width:100%;max-width:680px;display:flex;align-items:center;gap:16px}
.fu .nm{width:176px;text-align:right;font-weight:600;flex-shrink:0}
.fu .nm em{display:block;font-style:normal;font-size:var(--text-xs);color:var(--color-muted);font-weight:400}
.fu .bx{flex:1;display:flex;justify-content:center;min-width:0}
.fu .bd{height:40px;border-radius:var(--radius-control);display:flex;align-items:center;justify-content:center;font:800 var(--text-sm)/1 var(--font-display);min-width:56px;font-variant-numeric:tabular-nums}
.fu .rt{width:148px;font-size:var(--text-xs);color:var(--color-ink-2);flex-shrink:0}
.fu .rt b{display:block;color:var(--color-ink);font-size:var(--text-sm);font-weight:600}
.gr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:32px}
.cc{overflow:hidden;cursor:pointer;transition:transform var(--dur-short),border-color var(--dur-short),opacity var(--dur-short)}
.cc:hover{border-color:var(--color-accent-rule);transform:translateY(-2px)}
.cc:active{transform:translateY(0)}
.cc.sel{border-color:var(--color-accent);outline:2px solid var(--color-accent);outline-offset:-1px}
.cc.dim{opacity:.4}.cc.dim:hover{opacity:.85}
.cc.off{opacity:.68}.cc.off:hover{opacity:1}
.cc .hd{position:relative;height:132px;background:var(--color-paper);overflow:hidden}
.cc.sel .hd::before{content:'Selecionado';position:absolute;z-index:3;top:44px;left:12px;background:var(--color-accent);color:var(--color-accent-ink);font-size:var(--text-xs);font-weight:600;padding:0 8px;border-radius:var(--radius-control)}
.cc .hd img{width:100%;height:100%;object-fit:cover;opacity:.68;display:block}
.cc .hd .ov{position:absolute;inset:auto 0 0 0;padding:12px 16px;background:linear-gradient(var(--color-veil-clear),var(--color-veil))}
.cc .hd .nn{font:800 var(--text-sm)/1.3 var(--font-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc .hd .ss{font-size:var(--text-xs);color:var(--color-ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px}
.tg{background:var(--color-tag);border:1px solid var(--color-rule);border-radius:var(--radius-pill);padding:0 12px;font-size:var(--text-xs);font-weight:600;line-height:24px}
.tg.on{background:var(--color-good);border-color:var(--color-good);color:var(--color-good-ink)}
.tg.of{background:var(--color-bad);border-color:var(--color-bad);color:var(--color-bad-ink)}
.mm{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--color-rule)}
.mm>div{padding:12px 4px;text-align:center;border-left:1px solid var(--color-rule)}
.mm>div:first-child{border-left:0}
.mm .v{font:800 var(--text-sm)/1.3 var(--font-display);font-variant-numeric:tabular-nums}
.mm .l,.sf2 .l{font-size:var(--text-xs);color:var(--color-muted)}
.rt2{padding:12px 16px 0;border-top:1px solid var(--color-rule)}
.rb{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;background:var(--color-panel-3)}
.rb i{display:block;height:8px}
.rl{display:flex;justify-content:space-between;gap:4px;flex-wrap:wrap;font-size:var(--text-xs);color:var(--color-muted);margin-top:4px}
.sf2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 8px;padding:12px 16px}
.sf2>div{text-align:center}
.sf2 .v{font:800 var(--text-sm)/1.3 var(--font-display);font-variant-numeric:tabular-nums}
.ac{display:flex;gap:8px;padding:4px 16px 16px}
.ac a,.ac span{flex:1;display:flex;align-items:center;justify-content:center;min-height:40px;border-radius:var(--radius-control);font-size:var(--text-xs);text-decoration:none}
.ac a{font-weight:600;background:var(--color-accent);color:var(--color-accent-ink);transition:background-color var(--dur-micro)}
.ac a:hover{background:var(--color-ink)}
.ac a.s{background:var(--color-panel-2);color:var(--color-ink);border:1px solid var(--color-field)}
.ac a.s:hover{border-color:var(--color-accent);background:var(--color-panel-3)}
.ac span{color:var(--color-muted);border:1px solid var(--color-rule)}
.selchip{display:inline-flex;align-items:center;gap:8px;background:var(--color-accent-soft);border:1px solid var(--color-accent-rule);color:var(--color-accent);border-radius:var(--radius-pill);padding:4px 4px 4px 12px}
.selchip button{background:var(--color-panel-3);border:0;color:var(--color-ink);border-radius:var(--radius-pill);width:32px;height:32px;cursor:pointer}
.selchip button:hover{background:var(--color-field)}
.tw{overflow:auto;margin-bottom:32px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:var(--text-xs);font-variant-numeric:tabular-nums}
th{background:var(--color-panel-2);text-align:right;padding:12px;font-size:var(--text-xs);font-weight:600;color:var(--color-muted);white-space:nowrap;cursor:pointer}
th:hover{color:var(--color-ink)}
td{padding:12px;text-align:right;border-top:1px solid var(--color-rule);white-space:nowrap}
th:first-child,td:first-child{text-align:left;font-weight:600;position:sticky;left:0;z-index:1;background:var(--color-panel);max-width:280px;white-space:normal;min-width:180px}
th:first-child{background:var(--color-panel-2)}
tbody tr:hover td{background:var(--color-panel-2)}
tfoot td,tfoot td:first-child{background:var(--color-panel-3);font-weight:600;border-top:2px solid var(--color-accent)}
#tc tbody tr{cursor:pointer}
#tc tbody tr.sel td{background:var(--color-accent-soft)}
.nt{background:var(--color-warn-soft);border:1px solid var(--color-warn-rule);border-radius:var(--radius-card);padding:16px 20px;font-size:var(--text-xs);color:var(--color-warn-ink);line-height:1.65}
.ft{text-align:center;color:var(--color-muted);font-size:var(--text-xs);margin-top:24px}
.vazio{text-align:center;color:var(--color-muted);padding:44px 20px}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible,th:focus-visible,.cc:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px;transition:none}
@media (max-width:1100px){.gr{grid-template-columns:repeat(2,minmax(0,1fr))}.k{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){body{padding:16px 16px 40px}.gr{grid-template-columns:minmax(0,1fr)}.fu{flex-wrap:wrap;gap:4px 8px}.fu .nm{width:100%;text-align:left}.fu .nm em{display:inline;margin-left:8px}.fu .bx{flex:1 1 100%;justify-content:flex-start}.fu .rt{width:100%;margin-bottom:8px}.dt input{flex:1 1 120px;min-width:0}select{max-width:100%;width:100%}.fi{width:100%}.k{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}.cc:hover,.cc:active,.ps button:active,.selchip button:active,.ac a:active{transform:none}}

</div><script>const URL_DADOS='https://srv1809067.hstgr.cloud/ecf-dashboard.json';
let carregado=Date.now();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-carregado>18e5)location.reload()});
fetch(URL_DADOS,{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{
const DIAS=d.DIAS,ADS=d.ADS,M=d.M;

const n=v=>(v||0).toLocaleString('pt-BR'),mo=v=>'R$ '+(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}),
pc=(a,b)=>(b?a/b*100:0),f1=v=>v.toFixed(1).replace('.',',')+'%';
const HOJE=M.hoje;
const ehLead=t=>/LEADS/i.test(t||'');
const dmin=DIAS.length?DIAS.reduce((m,x)=>x.d<m?x.d:m,DIAS[0].d):HOJE;
const br=s=>s.split('-').reverse().join('/');
const addD=(s,k)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+k);return d.toISOString().slice(0,10)};
const PRESETS=[['hoje','Hoje',0,0],['ontem','Ontem',1,1],['7','7 dias',6,0],['14','14 dias',13,0],
 ['30','30 dias',29,0],['max','Máximo',null,0]];
let sel='max',D1=HOJE,D2=HOJE;
const el=i=>document.getElementById(i);
el('ps').innerHTML=PRESETS.map(([k,l])=>`<button data-k="${k}">${l}</button>`).join('');
el('ps').onclick=e=>{const k=e.target.dataset.k; if(!k)return; aplicaPreset(k); render();};
function aplicaPreset(k){
 sel=k; const p=PRESETS.find(x=>x[0]===k);
 if(k==='max'){D1=dmin;D2=HOJE;}
 else {D2=addD(HOJE,-p[3]); D1=addD(HOJE,-p[2]);}
 if(D1<dmin)D1=dmin;
 el('d1').value=D1; el('d2').value=D2;
}
el('d1').min=dmin; el('d2').min=dmin; el('d1').max=HOJE; el('d2').max=HOJE;
el('d1').onchange=el('d2').onchange=()=>{
 D1=el('d1').value||dmin; D2=el('d2').value||HOJE;
 if(D1>D2){const t=D1;D1=D2;D2=t;el('d1').value=D1;el('d2').value=D2;}
 sel=null; render();
};
function montaCamps(){
 const cur=el('fc').value, g={};
 DIAS.forEach(r=>{if(r.d<D1||r.d>D2)return;const a=ADS[r.a];if(!a)return;g[a.cid]=g[a.cid]||{nm:a.camp,sp:0};g[a.cid].sp+=r.sp||0;});
 const L=Object.entries(g).filter(([,v])=>v.sp>0).sort((a,b)=>b[1].sp-a[1].sp);
 el('fc').innerHTML='<option value="">Todas as campanhas ('+L.length+')</option>'+
  L.map(([id,v])=>`<option value="${id}">${v.nm}</option>`).join('');
 if(cur&&g[cur]) el('fc').value=cur;
}
el('fc').onchange=el('fs').onchange=render;

function agrega(){
 const cf=el('fc').value, sf=el('fs').value, por={};
 DIAS.forEach(r=>{
  if(r.d<D1||r.d>D2) return;
  const a=ADS[r.a]; if(!a) return;
  if(cf&&a.cid!==cf) return;
  const on=a.st==='ACTIVE';
  if(sf==='on'&&!on) return;
  if(sf==='off'&&on) return;
  const o=por[r.a]||(por[r.a]={id:r.a,sp:0,im:0,rc:0,cl:0,lc:0,ob:0,p3:0,p25:0,p50:0,p75:0,p100:0,pv:0,ca:0,ld:0,ic:0,pu:0,rv:0,nd:0});
  ['sp','im','rc','cl','lc','ob','p3','p25','p50','p75','p100','pv','ca','ld','ic','pu','rv']
   .forEach(k=>o[k]+=r[k]||0);
  o.nd++;
 });
 return Object.values(por).map(o=>Object.assign(o,ADS[o.id])).sort((x,y)=>y.sp-x.sp);
}
function agregaCamp(){
 const sf=el('fs').value, por={};
 DIAS.forEach(r=>{
  if(r.d<D1||r.d>D2) return;
  const a=ADS[r.a]; if(!a) return;
  const on=a.st==='ACTIVE';
  if(sf==='on'&&!on) return; if(sf==='off'&&on) return;
  const o=por[a.cid]||(por[a.cid]={cid:a.cid,nome:a.camp,ads:{},sp:0,im:0,cl:0,ob:0,p3:0,pv:0,ca:0,ld:0,ic:0,pu:0,rv:0});
  ['sp','im','cl','ob','p3','pv','ca','ld','ic','pu','rv'].forEach(k=>o[k]+=r[k]||0);
  o.ads[r.a]=on;
 });
 return Object.values(por).filter(o=>o.sp>0).map(o=>{const v=Object.values(o.ads);
  return Object.assign(o,{nads:v.length,non:v.filter(Boolean).length})}).sort((x,y)=>y.sp-x.sp);
}
function renderCamp(){
 const C=agregaCamp(), cf=el('fc').value;
 if(!C.length){el('tc').innerHTML='<tbody><tr><td class="vazio">Nenhuma campanha com gasto no período.</td></tr></tbody>';return;}
 const H=['Campanha','Situação','Gasto','Impr','CPM','Hook','CTR','Saída','PV','Carrinho','Lead','Custo/lead','Checkout','Compra','Custo/compra','Receita','ROAS'];
 const soma=(L,k)=>L.reduce((s,x)=>s+(x[k]||0),0),CL_=C.filter(x=>ehLead(x.nome)),CV_=C.filter(x=>!ehLead(x.nome));
 const spL=soma(CL_,'sp'),ldL=soma(CL_,'ld'),spV=soma(CV_,'sp');
 const cpl=x=>x.nome==='TOTAL'?(ldL?mo(spL/ldL):'-'):(ehLead(x.nome)&&x.ld?mo(x.sp/x.ld):'-');
 const cpa=x=>x.nome==='TOTAL'?(x.pu?mo(spV/x.pu):'-'):(!ehLead(x.nome)&&x.pu?mo(x.sp/x.pu):'-');
 const roas=x=>x.nome==='TOTAL'?(spV?(x.rv/spV).toFixed(2).replace('.',',')+'x':'-'):(ehLead(x.nome)?'-':(x.sp?x.rv/x.sp:0).toFixed(2).replace('.',',')+'x');
 const row=x=>[`<td>${x.nome}</td>`,
  `<td style="text-align:left">${x.non?'Ativa':'Pausada'} <span style="color:var(--color-muted)">${x.non}/${x.nads}</span></td>`,
  `<td>${mo(x.sp)}</td>`,`<td>${n(x.im)}</td>`,`<td>${mo(x.im?x.sp/x.im*1000:0)}</td>`,
  `<td>${pc(x.p3,x.im).toFixed(2).replace('.',',')}%</td>`,`<td>${pc(x.cl,x.im).toFixed(2).replace('.',',')}%</td>`,
  `<td>${n(x.ob)}</td>`,`<td>${n(x.pv)}</td>`,`<td>${n(x.ca)}</td>`,`<td>${n(x.ld)}</td>`,
  `<td>${cpl(x)}</td>`,`<td>${n(x.ic)}</td>`,
  `<td style="color:${x.pu?'var(--color-good)':'var(--color-muted)'}">${n(x.pu)}</td>`,`<td>${cpa(x)}</td>`,
  `<td>${mo(x.rv)}</td>`,`<td>${roas(x)}</td>`].join('');
 const T=k=>C.reduce((s,x)=>s+(x[k]||0),0);
 const tot={nome:'TOTAL',sp:T('sp'),im:T('im'),cl:T('cl'),ob:T('ob'),p3:T('p3'),pv:T('pv'),ca:T('ca'),ld:T('ld'),ic:T('ic'),pu:T('pu'),rv:T('rv'),non:C.filter(x=>x.non).length,nads:C.length};

}

  (alvo?`<span class="selchip">Criativo: ${alvo.nome}, ${mo(alvo.sp)}<button id="limpa" title="Ver todos">×</button></span>`

 if(!L.length){

  el('tb').innerHTML=''; return;
 }
 el('big').innerHTML=[['Investido',mo(sp),`CPM ${mo(im?sp/im*1000:0)}`,'var(--color-ink)'],

  ['Leads',n(ld),ld?`${mo(spL/ld)} por lead`:'nenhum no período','var(--color-accent)'],
  ['Compras',n(pu),pu?`${mo(spV/pu)} por compra`:'nenhuma no período',pu?'var(--color-good)':'var(--color-bad)']]
  .map(([l,v,s,c])=>`<div class="bc" style="--ac:${c}"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s}</div></div>`).join('');
 const kk=[['Impressões',n(im)],['Hook 3s',f1(pc(p3,im))],['CTR',f1(pc(cl,im))],
  ['Cliques saída',n(ob)],['Add carrinho',n(ca)],['Checkout',n(ic)],['Receita',mo(rv)],
  ['ROAS da Live',(spV?rv/spV:0).toFixed(2).replace('.',',')+'x']];
 if(nd===1) kk.splice(1,0,['Alcance',n(T('rc'))],['Frequência',(T('rc')?im/T('rc'):0).toFixed(2)]);
 el('k').innerHTML=kk.map(([l,v])=>`<div class="kc"><div class="l">${l}</div><div class="v">${v}</div></div>`).join('');
 const CL=[1,2,3,4,5,6,7,8,9].map(i=>'var(--f'+i+')');
 const F=[['Impressões','anúncio entregue',im,null,sp],['Views de 3s','prendeu no início',p3,im,sp],
  ['Cliques','no anúncio',cl,im,sp],['Cliques de saída','saiu do Meta',ob,cl,sp],
  ['Page View','página carregou',pv,ob,sp],['Clique em comprar','só na página B da Live',ca,pv,spV],
  ['Checkout','abriu a Hotmart',ic,pv,spV],['Compra','pagou',pu,ic,spV],['Lead','formulário da consultoria',ld,pv,spL]];
 el('fn').innerHTML=F.map(([l,s,v,b,g],i)=>{const w=im?Math.max(v/im*100,v>0?4:2):2;
  return `<div class="fu"><div class="nm">${l}<em>${s}</em></div>
  <div class="bx"><div class="bd" style="width:${w}%;background:${CL[i]};color:${i>=4?'var(--color-accent-ink)':'var(--color-ink)'}">${n(v)}</div></div>
  <div class="rt"><b>${v&&g?mo(g/v):'-'}</b>${b!==null?f1(pc(v,b))+(b===pv&&i>=5?' das visitas':' da etapa'):'base'}</div></div>`}).join('');
 const SEG=[['p25','var(--color-accent)'],['p50','var(--color-warn)'],['p75','var(--color-violet)'],['p100','var(--color-good)']];
 el('gr').innerHTML=L.map(x=>{
  const hk=pc(x.p3,x.im),hd=pc(x.p100,x.p3),ativo=x.st==='ACTIVE';
  const cls=(ativo?'':'off ')+(selAd===x.id?'sel ':(selAd?'dim ':''));
  return `<div class="cc ${cls}" data-id="${x.id}"><div class="hd">${x.img?`<img loading="lazy" decoding="async" src="${x.img}">`:''}

  <span class="tg">${mo(x.sp)}</span></div>
  <div class="ov"><div class="nn">${x.nome}</div><div class="ss">${x.conj}</div></div></div>
  <div class="mm"><div><div class="v" style="color:var(--color-accent)">${mo(x.sp)}</div><div class="l">Gasto</div></div>
  <div><div class="v" style="color:var(--color-accent)">${hk.toFixed(1).replace('.',',')}%</div><div class="l">Hook 3s</div></div>
  <div><div class="v" style="color:${hd>=15?'var(--color-good)':'var(--color-bad)'}">${hd.toFixed(1).replace('.',',')}%</div><div class="l">Hold 100%</div></div>
  <div><div class="v">${pc(x.cl,x.im).toFixed(2).replace('.',',')}%</div><div class="l">CTR</div></div></div>
  ${x.p3?`<div class="rt2"><div class="rb">${SEG.map(([s,c])=>`<i style="width:${pc(x[s],x.p3)}%;background:${c}"></i>`).join('')}</div>
  <div class="rl"><span>25%: ${n(x.p25)}</span><span>50%: ${n(x.p50)}</span><span>75%: ${n(x.p75)}</span><span>100%: ${n(x.p100)}</span></div></div>`:''}
  <div class="sf2"><div><div class="v">${n(x.ob)}</div><div class="l">Saída</div></div>
  <div><div class="v">${n(x.pv)}</div><div class="l">Page view</div></div>
  <div><div class="v">${n(x.ca)}</div><div class="l">Carrinho</div></div>
  <div><div class="v">${n(x.ld)}</div><div class="l">Lead</div></div>
  <div><div class="v">${n(x.ic)}</div><div class="l">Checkout</div></div>
  <div><div class="v" style="color:${x.pu?'var(--color-good)':'var(--color-muted)'}">${n(x.pu)}</div><div class="l">Compra</div></div></div>
  <div class="ac">${x.post?`<a href="${x.post}" target="_blank">Ver post</a>`:'<span>sem post</span>'}
  ${x.preview?`<a class="s" href="${x.preview}" target="_blank">Prévia</a>`:'<span>sem prévia</span>'}</div></div>`}).join('');
 el('gr').querySelectorAll('.cc').forEach(c=>c.onclick=e=>{
  if(e.target.closest('a')) return;
  const id=c.dataset.id; selAd=(selAd===id?null:id); render();
  document.querySelector('.big').scrollIntoView({behavior:'smooth',block:'start'});
 });
 const C=[['Criativo','nome',9],['Situação','st',8],['Dias','nd',0],['Gasto','sp',1],['Impr','im',0],
  ['CPM','cpm',1],['Hook','hook',2],['CTR','ctrx',2],['Saída','ob',0],['PV','pv',0],['Carrinho','ca',0],
  ['Lead','ld',0],['Checkout','ic',0],['Compra','pu',0],['Receita','rv',1],['ROAS','roas',3]];
 const R=S.map(x=>Object.assign({},x,{cpm:x.im?x.sp/x.im*1000:0,hook:pc(x.p3,x.im),
  ctrx:pc(x.cl,x.im),roas:x.sp?x.rv/x.sp:0}));
 R.sort((a,b)=>{const u=a[ordem],v=b[ordem];
  return (typeof u==='string'?u.localeCompare(v):u-v)*(asc?1:-1)});
 el('tb').innerHTML='<thead><tr>'+C.map(c=>`<th data-k="${c[1]}">${c[0]}${ordem===c[1]?(asc?' ▲':' ▼'):''}</th>`).join('')+'</tr></thead><tbody>'+
  R.map(x=>'<tr>'+C.map(([,k,f])=>{const v=x[k];
   if(f===8) return `<td style="text-align:left">${v==='ACTIVE'?'Ativo':'Pausado'}</td>`;
   if(f===9) return `<td>${v}</td>`;
   return `<td>${f===0?n(v):f===1?mo(v):f===2?(v||0).toFixed(2).replace('.',',')+'%':(v||0).toFixed(2).replace('.',',')+'x'}</td>`}).join('')+'</tr>').join('')+
  `</tbody><tfoot><tr><td>${selAd?'SELECIONADO':'TOTAL'}</td><td style="text-align:left">${selAd?'':on+' ativos'}</td><td>${nd}</td><td>${mo(sp)}</td>
  <td>${n(im)}</td><td>${mo(im?sp/im*1000:0)}</td><td>${pc(p3,im).toFixed(2).replace('.',',')}%</td><td>${pc(cl,im).toFixed(2).replace('.',',')}%</td>
  <td>${n(ob)}</td><td>${n(pv)}</td><td>${n(ca)}</td><td>${n(ld)}</td><td>${n(ic)}</td><td>${n(pu)}</td>
  <td>${mo(rv)}</td><td>${(spV?rv/spV:0).toFixed(2).replace('.',',')}x</td></tr></tfoot>`;
 el('tb').querySelectorAll('th').forEach(t=>t.onclick=()=>{
  const k=t.dataset.k; if(ordem===k)asc=!asc; else{ordem=k;asc=false} render()});
}
el('nt').innerHTML='<b>Como ler:</b> hook rate = views de 3s sobre impressões, mede se prende no início. Hold = quem viu 100% sobre quem viu 3s. Cliques de saída são os que realmente saíram do Meta, mais honesto que o CTR total. Carrinho = clique no botão de compra da página B da Live (a página A não mede esse clique e conta o checkout em dobro), lead = formulário da consultoria enviado, checkout = abertura da Hotmart. A situação (ativo/pausado) é a de agora, não a do período escolhido. Custo por compra e ROAS usam só a verba das campanhas de venda; custo por lead, só a das campanhas de leads. Fuso da conta: America/Sao_Paulo.';

}).catch(()=>{document.getElementById('sb').textContent='Não foi possível carregar os dados agora. Tente de novo em alguns minutos.'});
